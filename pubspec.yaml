name: bishare
description: "BIShare — cross-platform LAN file sharing"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.4.5+245

environment:
  sdk: ">=3.11.1 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # App localization (JSON translations + `.tr()`), 13 languages.
  easy_localization: ^3.0.7

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  freezed_annotation: ^3.1.0
  equatable: ^2.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  dio: ^5.10.0
  retrofit: ^4.9.2
  dio_smart_retry: ^7.0.1
  json_annotation: ^4.12.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  bonsoir: ^7.1.4
  cryptography: ^2.9.0
  crypto: ^3.0.7
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  # OAuth sign-in (Apple) — augments the magic-link flow (Fase A). Google
  # sign-in was removed while unused: google_sign_in pulls proprietary Play
  # Services into every Android build, which blocks F-Droid. Re-add behind a
  # FOSS-flavor seam if/when the login flow actually wires it up.
  sign_in_with_apple: ^8.1.0
  file_picker: ^10.0.0
  # Folder-sync change detection (FSEvents/inotify/RDCW + polling fallback).
  watcher: ^1.1.4
  cross_file: ^0.3.5+4
  mime: ^2.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  go_router: ^17.3.0
  app_links: ^7.0.0
  uuid: ^4.5.3
  logger: ^2.7.0
  rxdart: ^0.28.0
  collection: ^1.19.1
  flutter_rust_bridge: 2.12.0
  bishare_ffi:
    path: rust_builder
  open_filex: ^4.7.0
  shadcn_ui: ^0.55.0
  archive: ^4.0.9
  image: ^4.8.0
  desktop_drop: ^0.7.1
  # Desktop polish (macOS/Windows/Linux): native window, menu-bar/tray, autostart.
  window_manager: ^0.4.3
  tray_manager: ^0.3.2
  launch_at_startup: ^0.5.1
  package_info_plus: ^8.1.1
  device_info_plus: ^12.4.0
  record: ^7.1.1
  flutter_contacts: ^2.2.2
  share_plus: ^12.0.2
  photo_view: ^0.15.0
  # Pinned to 2.3.0 (last version WITHOUT an SPM manifest): 2.3.1+ ships a
  # Package.swift declaring macOS 11.0, which exceeds Flutter's SPM umbrella
  # default (10.15) and makes Xcode flag a version mismatch after every
  # `flutter pub get`. On 2.3.0, gal resolves via CocoaPods (Podfile macOS 11.0)
  # instead, so the umbrella issue never occurs. Un-pin once Flutter's SPM
  # umbrella respects the project deployment target at generation time.
  gal: ^2.3.3 # ≥2.3.2 links `windowsapp` — fixes Windows LNK2019 (WinRT). Apple pin reason is gone.
  app_tracking_transparency: ^2.0.7
  shelf_multipart: ^2.0.1
  video_thumbnail: ^0.5.6
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^22.0.1
  compact_toast: ^0.0.1
  mobile_scanner: ^7.2.0
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  flutter_webrtc: ^0.14.1
  flutter_image_compress: ^2.4.0
  flutter_svg: ^2.3.0
  showcaseview: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  retrofit_generator: ^10.2.7
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  drift_dev: ^2.34.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  convert: ^3.1.2
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Apple builds use CocoaPods, NOT Swift Package Manager.
  # Repo-durable opt-out (works on any machine/CI regardless of the
  # global `flutter config` value). SPM manifest breakages like
  # gal 2.3.1+ don't apply on the CocoaPods path.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon/svg/
    - assets/icon/bishare_icon.png
    - assets/translations/

  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# App icon generation — run: dart run flutter_launcher_icons
# Sources live in assets/icon/ (generated from the BIShare vector mark).
# NOTE: icon source is a full-bleed opaque square on purpose — iOS/macOS/Android
# apply their own rounded-corner mask at display time.
flutter_launcher_icons:
  image_path: "assets/icon/bishare_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/bishare_bg.png"
  adaptive_icon_foreground: "assets/icon/bishare_fg.png"
  macos:
    generate: true
    image_path: "assets/icon/bishare_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/bishare_icon.png"
    icon_size: 256
# --- FOSS build override (appended by tool/foss_flavor.sh) ---
dependency_overrides:
  mobile_scanner:
    path: fdroid/mobile_scanner_stub
