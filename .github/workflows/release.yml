name: release

# Builds the installable artifacts for a version tag and attaches them to a
# GitHub Release: Android APK (release-signed), macOS DMG (ad-hoc signed —
# Gatekeeper right-click-open until notarization lands), Windows x64 ZIP
# (unsigned), Linux x64 tar.gz + .deb + AppImage. The Snap has its own
# workflow (snap.yml) on the same tag. winget/Scoop manifests that point at
# the Windows ZIP live in packaging/.
#
# Usage: push a tag like v2.4.5 (or run manually via workflow_dispatch, which
# names artifacts after the short SHA instead).
#
# Shared gotchas (mirrors ci.yml / windows.yml — keep in sync):
#  - frb_generated.* are gitignored → regenerate with the pinned codegen 2.12.0
#  - protocol crate is vendored (rust/bishare-protocol) — single checkout
#  - windows-2022 pin: windows-latest's preview MSVC hard-errors gal /
#    permission_handler_windows (/await + <experimental/coroutine>)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version to build + attach to (e.g. 2.4.5, no leading v). Empty = artifacts only, no release."
        required: false
        default: ""
      play_track:
        description: "Upload the Android bundle to this Play track (tags always upload to internal)"
        type: choice
        options: ["none", "internal"]
        default: "none"
      build_number:
        description: "Override the build number (Android versionCode / iOS CFBundleVersion). Must exceed what the store already has. Empty = pubspec."
        required: false
        default: ""
      build_name:
        description: "Override the version string (e.g. 2.4.7). Apple closes a version's train once it ships, so a test upload needs an unreleased one. Empty = pubspec."
        required: false
        default: ""
      apple_upload:
        description: "Upload the iOS build to TestFlight (tags always do)"
        type: choice
        options: ["none", "testflight"]
        default: "none"
      mac_upload:
        description: "Upload the Mac App Store build to TestFlight (tags always do)"
        type: choice
        options: ["none", "testflight"]
        default: "none"
      mac_dmg:
        description: "Build the notarized direct-download DMG (tags always do)"
        type: choice
        options: ["none", "build"]
        default: "none"

permissions:
  contents: write

env:
  FRB_VERSION: "2.12.0"
  VERSION_INPUT: ${{ inputs.version }}
  PLAY_TRACK: ${{ inputs.play_track }}
  BUILD_NUMBER: ${{ inputs.build_number }}
  BUILD_NAME: ${{ inputs.build_name }}
  APPLE_UPLOAD: ${{ inputs.apple_upload }}
  MAC_UPLOAD: ${{ inputs.mac_upload }}
  MAC_DMG: ${{ inputs.mac_dmg }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Restore release signing (from encrypted repo secrets)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/bishare-release.jks
          cat > android/key.properties <<'EOF'
          ${{ secrets.ANDROID_KEY_PROPERTIES }}
          EOF
      - run: flutter pub get
      - name: flutter_rust_bridge codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version $FRB_VERSION
          flutter_rust_bridge_codegen generate
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build APK (release, universal)
        run: flutter build apk --release
      # Play only accepts bundles, so the store upload builds its own artifact.
      # The versionCode comes from pubspec (the same number iOS uses), unless a
      # dispatch overrides it — Play rejects any code it has already seen.
      - name: Build App Bundle (release)
        run: |
          if [ -n "$BUILD_NUMBER" ]; then
            flutter build appbundle --release --build-number="$BUILD_NUMBER"
          else
            flutter build appbundle --release
          fi
      - name: Name artifacts
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="${VERSION_INPUT:-${GITHUB_SHA::7}}"
          cp build/app/outputs/flutter-apk/app-release.apk "BIShare-$VER-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "BIShare-$VER-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            BIShare-*-android.apk
            BIShare-*-android.aab
          if-no-files-found: error
      # Every tag lands on the internal track and stops there. Promotion to
      # production is a button in Play Console, on purpose — a tag should never
      # be able to reach users on its own.
      - name: Upload to Google Play (internal track)
        if: github.ref_type == 'tag' || inputs.play_track == 'internal'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bishare.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

  # iOS → TestFlight. Every tag uploads a build and stops there; pressing
  # "submit for review" stays in App Store Connect, the same rule as Play's
  # internal track. Signing: the Apple Distribution certificate comes in as a
  # .p12 secret and lives in a throwaway keychain for the job; the provisioning
  # profile is fetched by Xcode itself via the App Store Connect API key
  # (-allowProvisioningUpdates), so no profile is stored anywhere.
  ios:
    if: github.ref_type == 'tag' || inputs.apple_upload == 'testflight'
    # The iOS project uses file-system-synchronized groups, which need Xcode 16+;
    # macos-14 ships Xcode 15 and its xcodebuild aborts on the project file.
    runs-on: macos-15
    env:
      TEAM_ID: 59T9LR42SG
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Use the newest Xcode on the image
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC" && xcodebuild -version
      - name: Install the distribution certificate (throwaway keychain)
        env:
          P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          DEV_P12_BASE64: ${{ secrets.APPLE_DEV_P12_BASE64 }}
          DEV_P12_PASSWORD: ${{ secrets.APPLE_DEV_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$DEV_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          # Automatic signing archives with a *development* identity and only
          # re-signs for distribution at export. With none present, Xcode mints
          # a fresh one through the API key on every run and its private key
          # dies with the runner — four such stray certificates appeared on
          # the account in a single afternoon. This one is permanent.
          security import "$RUNNER_TEMP/dev.p12" -k "$KC" -P "$DEV_P12_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/dev.p12"
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" || { echo "no Apple Distribution identity"; exit 1; }
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Development" || { echo "no Apple Development identity"; exit 1; }
      - name: Install the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: flutter_rust_bridge codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version $FRB_VERSION
          flutter_rust_bridge_codegen generate
      - run: dart run build_runner build --delete-conflicting-outputs
      # flutter build ios wires up Generated.xcconfig (version + build number
      # from pubspec, or the override) and runs pod install. Signing happens in
      # the xcodebuild steps, which can pass the API-key arguments Flutter can't.
      - name: Prepare the iOS build
        run: |
          flutter build ios --release --no-codesign \
            ${BUILD_NUMBER:+--build-number="$BUILD_NUMBER"} \
            ${BUILD_NAME:+--build-name="$BUILD_NAME"}
      - name: Archive (automatic signing via API key)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ios/Runner.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID"
      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/ios/ipa
      - name: Upload to TestFlight
        run: |
          IPA=$(/bin/ls build/ios/ipa/*.ipa | head -1)
          # altool prints "ERROR:" on a rejected upload but can still exit 0,
          # which turned a 409 into a green step. Fail on the message itself.
          OUT=$(xcrun altool --upload-app --type ios -f "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1); RC=$?
          echo "$OUT"
          [ $RC -eq 0 ] && ! echo "$OUT" | grep -q "ERROR" || { echo "::error::TestFlight upload failed"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  # Mac App Store → TestFlight. The same shape as the ios job: Flutter only
  # writes the project configuration, xcodebuild archives and exports with the
  # API key, altool uploads, and it stops at TestFlight. The pkg needs a second
  # certificate — Mac Installer Distribution — which is why two .p12 secrets
  # go into the keychain here. (This is the App Store build; the ad-hoc DMG
  # job below is a different, still-disabled thing.)
  mac-app-store:
    if: github.ref_type == 'tag' || inputs.mac_upload == 'testflight'
    # The iOS project uses file-system-synchronized groups, which need Xcode 16+;
    # macos-14 ships Xcode 15 and its xcodebuild aborts on the project file.
    runs-on: macos-15
    env:
      TEAM_ID: 59T9LR42SG
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Use the newest Xcode on the image
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC" && xcodebuild -version
      - name: Install the distribution + installer certificates (throwaway keychain)
        env:
          DIST_P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          INST_P12_BASE64: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          INST_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
          DEV_P12_BASE64: ${{ secrets.APPLE_DEV_P12_BASE64 }}
          DEV_P12_PASSWORD: ${{ secrets.APPLE_DEV_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$DIST_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$INST_P12_BASE64" | base64 -d > "$RUNNER_TEMP/inst.p12"
          echo "$DEV_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dev.p12"
          # Same reason as the ios job: a permanent development identity, so
          # automatic signing stops minting a throwaway one per run.
          security import "$RUNNER_TEMP/dev.p12" -k "$KC" -P "$DEV_P12_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          # -A: no per-tool ACL prompt at all. A headless runner cannot click
          # "Allow", and productbuild asking for the installer key is exactly
          # what left the export step hanging for 90 minutes.
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security import "$RUNNER_TEMP/inst.p12" -k "$KC" -P "$INST_P12_PASSWORD" -A \
            -T /usr/bin/productsign -T /usr/bin/productbuild -T /usr/bin/pkgbuild \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/inst.p12" "$RUNNER_TEMP/dev.p12"
          security find-identity -v "$KC" | grep -q "Apple Distribution" || { echo "no Apple Distribution identity"; exit 1; }
          security find-identity -v "$KC" | grep -q "Installer" || { echo "no Mac Installer identity"; exit 1; }
          security find-identity -v "$KC" | grep -q "Apple Development" || { echo "no Apple Development identity"; exit 1; }
      - name: Install the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: flutter_rust_bridge codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version $FRB_VERSION
          flutter_rust_bridge_codegen generate
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Prepare the macOS build (configuration only)
        run: |
          flutter build macos --release --config-only \
            ${BUILD_NUMBER:+--build-number="$BUILD_NUMBER"} \
            ${BUILD_NAME:+--build-name="$BUILD_NAME"}
      - name: Archive (automatic signing via API key)
        run: |
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=macOS' -archivePath build/macos/Runner.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID"
      - name: Export signed pkg
        # An export that is still running after 20 minutes is waiting on a
        # dialog nobody can answer. Fail it and keep the log.
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/macos/Runner.xcarchive \
            -exportOptionsPlist macos/ExportOptions.plist -exportPath build/macos/pkg \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/macos/export.log
          ls -la build/macos/pkg
      - name: Keep the export log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-export-log
          path: build/macos/export.log
          if-no-files-found: ignore
      - name: Upload to TestFlight (macOS)
        run: |
          PKG=$(/bin/ls build/macos/pkg/*.pkg | head -1)
          OUT=$(xcrun altool --upload-app --type macos -f "$PKG" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1); RC=$?
          echo "$OUT"
          [ $RC -eq 0 ] && ! echo "$OUT" | grep -q "ERROR" || { echo "::error::TestFlight upload failed"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app-store
          path: build/macos/pkg/*.pkg
          if-no-files-found: error

  # Direct-download macOS build: Developer ID signed, hardened runtime,
  # notarized, stapled, packaged as a DMG and attached to the GitHub Release.
  # This is deliberately a different signing path from mac-app-store — an App
  # Store package opened outside the Store is refused by Gatekeeper with the
  # "could not verify it is free of malware" dialog, which is exactly what
  # happened when the .pkg was double-clicked. Only this kind of build is
  # accepted for installation from a website.
  #
  # No provisioning profile and no -allowProvisioningUpdates: Sign in with
  # Apple is the one restricted entitlement, and it is stripped here (login is
  # behind a remote flag), so manual signing with the certificate alone is
  # enough and nothing gets minted on the account.
  macos:
    if: github.ref_type == 'tag' || inputs.mac_dmg == 'build'
    runs-on: macos-15
    env:
      TEAM_ID: 59T9LR42SG
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DEVID_IDENTITY: "Developer ID Application: PT BILLION JAYA GROUP (59T9LR42SG)"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Use the newest Xcode on the image
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC" && xcodebuild -version
      - name: Install the Developer ID certificate (throwaway keychain)
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
        run: |
          [ -n "$P12_BASE64" ] || { echo "::error::APPLE_DEVID_P12_BASE64 secret is missing"; exit 1; }
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$P12_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          security find-identity -v -p codesigning "$KC" | grep -q "Developer ID Application" \
            || { echo "::error::no Developer ID Application identity in keychain"; exit 1; }
      - name: Install the App Store Connect API key (for notarytool)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: flutter_rust_bridge codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version $FRB_VERSION
          flutter_rust_bridge_codegen generate
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Prepare the macOS build (configuration only)
        run: |
          flutter build macos --release --config-only \
            ${BUILD_NUMBER:+--build-number="$BUILD_NUMBER"} \
            ${BUILD_NAME:+--build-name="$BUILD_NAME"}
      - name: Archive (Developer ID, hardened runtime, manual signing)
        run: |
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=macOS' -archivePath build/macos/Runner-devid.xcarchive archive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$DEVID_IDENTITY" DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="" ENABLE_HARDENED_RUNTIME=YES OTHER_CODE_SIGN_FLAGS="--timestamp"
      - name: Export the app
        timeout-minutes: 20
        run: |
          xcodebuild -exportArchive -archivePath build/macos/Runner-devid.xcarchive \
            -exportOptionsPlist macos/ExportOptions-developer-id.plist -exportPath build/macos/devid
          ls -la build/macos/devid
      # notarytool prints the verdict; anything but Accepted is a failure, and
      # the notarization log says why (missing timestamp, non-hardened binary…).
      - name: Notarize and staple the app
        timeout-minutes: 40
        run: |
          APP=$(/bin/ls -d build/macos/devid/*.app | head -1)
          ditto -c -k --keepParent "$APP" build/macos/app.zip
          OUT=$(xcrun notarytool submit build/macos/app.zip --key "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m 2>&1); echo "$OUT"
          if ! echo "$OUT" | grep -q "status: Accepted"; then
            SUB=$(echo "$OUT" | grep -m1 -oE 'id: [0-9a-f-]{36}' | cut -d' ' -f2)
            [ -n "$SUB" ] && xcrun notarytool log "$SUB" --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            echo "::error::app notarization was not accepted"; exit 1
          fi
          xcrun stapler staple "$APP"
      - name: Package, sign, notarize and staple the DMG
        timeout-minutes: 40
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="${VERSION_INPUT:-${BUILD_NAME:-${GITHUB_SHA::7}}}"
          APP=$(/bin/ls -d build/macos/devid/*.app | head -1)
          rm -rf dmg-staging && mkdir dmg-staging
          cp -R "$APP" dmg-staging/BIShare.app
          ln -s /Applications dmg-staging/Applications
          DMG="BIShare-$VER-macos.dmg"
          hdiutil create -volname "BIShare" -srcfolder dmg-staging -ov -format UDZO "$DMG"
          codesign --sign "$DEVID_IDENTITY" --timestamp "$DMG"
          OUT=$(xcrun notarytool submit "$DMG" --key "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m 2>&1); echo "$OUT"
          if ! echo "$OUT" | grep -q "status: Accepted"; then
            SUB=$(echo "$OUT" | grep -m1 -oE 'id: [0-9a-f-]{36}' | cut -d' ' -f2)
            [ -n "$SUB" ] && xcrun notarytool log "$SUB" --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            echo "::error::DMG notarization was not accepted"; exit 1
          fi
          xcrun stapler staple "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
      # The same assessment a user's Mac performs on a downloaded file. If
      # this says anything but accepted, the release would show the malware
      # dialog, so the build fails here instead.
      - name: Gatekeeper assessment
        run: |
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"
          APP=$(/bin/ls -d build/macos/devid/*.app | head -1)
          spctl --assess --type execute -vv "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: BIShare-*-macos.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: flutter_rust_bridge codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version $env:FRB_VERSION
          flutter_rust_bridge_codegen generate
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Windows (release)
        run: flutter build windows --release
      - name: Package ZIP
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") }
                 elseif ($env:VERSION_INPUT) { $env:VERSION_INPUT }
                 else { $env:GITHUB_SHA.Substring(0,7) }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "BIShare-$ver-windows-x64.zip"

      # TWO MSIX variants, because they are not interchangeable.
      #
      # --store: unsigned, and the Publisher is taken verbatim from
      # msix_config. This is the one Partner Center accepts — it re-signs
      # submissions itself, and the manifest Publisher must match the account.
      #
      # test: signed with msix's throwaway certificate so it can actually be
      # INSTALLED for testing. Note the trap this exposes — a signed package
      # takes its Publisher from the certificate subject, so the test build
      # reports "CN=Msix Testing, O=Msix Testing Corporation" no matter what
      # msix_config says. Submitting that one would be rejected outright.
      - name: Package MSIX — Store submission (unsigned)
        shell: pwsh
        run: |
          # A dispatch with no version still has to produce a submittable
          # package, and 0.0.0.0 is not one — the Store needs a real version.
          # Fall back to pubspec, which is the version this build actually is.
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") }
                 elseif ($env:VERSION_INPUT) { $env:VERSION_INPUT }
                 else { (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value }
          echo "MSIX_VER=$ver" >> $env:GITHUB_ENV
          dart run msix:create `
            --store `
            --version "$ver.0" `
            --output-name "BIShare-$ver-windows-x64-store"

      # Fails the build rather than shipping a package the Store will bounce.
      - name: Verify the Store manifest
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Recurse -Filter "*-store.msix" | Select-Object -First 1
          if (-not $msix) { throw "no store MSIX produced" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          $entry = $zip.Entries | Where-Object { $_.FullName -eq "AppxManifest.xml" }
          $reader = New-Object System.IO.StreamReader($entry.Open())
          $xml = [xml]$reader.ReadToEnd(); $reader.Close(); $zip.Dispose()
          $id = $xml.Package.Identity
          Write-Host "Identity Name : $($id.Name)"
          Write-Host "Publisher     : $($id.Publisher)"
          Write-Host "Version       : $($id.Version)"
          $caps = $xml.Package.Capabilities.Capability.Name
          Write-Host "Capabilities  : $($caps -join ', ')"
          # The Store rejects a publisher that doesn't match the account, and a
          # test-certificate subject is the classic way that happens silently.
          if ($id.Publisher -match "Msix Testing") {
            throw "Store package carries the test certificate publisher — it would be rejected"
          }
          if ($id.Version -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw "Store requires a four-part version ending in 0; got $($id.Version)"
          }
          # Local transfer dies in the MSIX sandbox without this one.
          if ($caps -notcontains "privateNetworkClientServer") {
            throw "privateNetworkClientServer missing — LAN discovery would silently fail"
          }
          Write-Host "Store manifest OK"

      # `msix:create` clears its output directory, so the test build below
      # deletes the store package before the upload step can ever see it —
      # which is exactly what happened on the first dispatch that used this
      # workflow. Move the submission copy out of reach first.
      - name: Set the Store package aside
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $store = Get-ChildItem -Recurse -Filter "*-store.msix" | Select-Object -First 1
          if (-not $store) { throw "store MSIX vanished before it could be kept" }
          Move-Item -Force $store.FullName dist/
          Get-ChildItem dist
          # Both MSIX variants stay CI artifacts on purpose: the store one
          # is unsigned and the test one carries a throwaway certificate,
          # so neither belongs on a public release. The ZIP is the download.

      # Installable build for testing on a real machine before submitting.
      - name: Package MSIX — sideload test build (self-signed)
        shell: pwsh
        continue-on-error: true
        run: |
          dart run msix:create `
            --version "$env:MSIX_VER.0" `
            --output-name "BIShare-$env:MSIX_VER-windows-x64-test" `
            --install-certificate false

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            BIShare-*-windows-x64.zip
            dist/*-store.msix
            build/windows/**/*-test.msix
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libayatana-appindicator3-dev \
            libkeybinder-3.0-dev
      # flutter_zxing compiles zxing-cpp, which uses C++20 ranges that 22.04's
      # clang 14 cannot build against libstdc++ 12 ("no matching function for
      # call to 'construct_at'" in LocalGrid.cpp). Clang 18 from apt.llvm.org
      # builds it; staying on 22.04 keeps the glibc floor where it was. Flutter
      # invokes plain `clang`/`clang++`, so they are shimmed ahead on PATH.
      - name: Clang 18 for the native plugins
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 18
          mkdir -p "$RUNNER_TEMP/clang18"
          ln -sf "$(command -v clang-18)" "$RUNNER_TEMP/clang18/clang"
          ln -sf "$(command -v clang++-18)" "$RUNNER_TEMP/clang18/clang++"
          echo "$RUNNER_TEMP/clang18" >> "$GITHUB_PATH"
      - run: clang++ --version
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: flutter_rust_bridge codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version $FRB_VERSION
          flutter_rust_bridge_codegen generate
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Linux (release)
        run: flutter build linux --release
      - name: Package tar.gz
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="${VERSION_INPUT:-${GITHUB_SHA::7}}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          # A Debian version MUST start with a digit, so a bare short SHA (what
          # a manual dispatch without a version falls back to) is rejected by
          # dpkg-deb. Give the .deb its own version that always starts with one.
          case "$VER" in
            [0-9]*) DEB_VER="$VER" ;;
            *)      DEB_VER="0.0.0+$VER" ;;
          esac
          echo "DEB_VER=$DEB_VER" >> "$GITHUB_ENV"
          tar -C build/linux/x64/release/bundle -czf "BIShare-$VER-linux-x64.tar.gz" .
      # .deb: bundle to /opt/bishare, launcher symlink in /usr/bin, desktop
      # entry + hicolor icon. Depends mirrors the runtime side of the apt
      # build deps above.
      - name: Package .deb
        run: |
          STAGE=deb-staging
          mkdir -p "$STAGE/DEBIAN" "$STAGE/opt/bishare" "$STAGE/usr/bin" \
                   "$STAGE/usr/share/applications" \
                   "$STAGE/usr/share/icons/hicolor/512x512/apps"
          cp -r build/linux/x64/release/bundle/. "$STAGE/opt/bishare/"
          ln -s /opt/bishare/bishare "$STAGE/usr/bin/bishare"
          cp linux/packaging/bishare.desktop "$STAGE/usr/share/applications/"
          cp assets/icon/bishare_icon.png "$STAGE/usr/share/icons/hicolor/512x512/apps/bishare.png"
          SIZE=$(du -sk "$STAGE" | cut -f1)
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: bishare
          Version: $DEB_VER
          Architecture: amd64
          Maintainer: BIShare project <support@billiongroup.net>
          Section: net
          Priority: optional
          Installed-Size: $SIZE
          Homepage: https://bishare.app
          Depends: libgtk-3-0, libayatana-appindicator3-1, libkeybinder-3.0-0, liblzma5
          Description: Fast, private, cross-platform file sharing
           Direct device-to-device transfers over the local network, end-to-end
           encrypted. Works with iPhone, Android, macOS, Windows, Linux and any
           browser. No account, no ads, no cloud in the middle.
          EOF
          dpkg-deb --build --root-owner-group "$STAGE" "BIShare-$VER-linux-x64.deb"
      # AppImage: self-contained AppDir wrapping the same bundle. FUSE is
      # unavailable on hosted runners, hence --appimage-extract-and-run.
      - name: Package AppImage
        run: |
          APPDIR=BIShare.AppDir
          mkdir -p "$APPDIR/opt/bishare"
          cp -r build/linux/x64/release/bundle/. "$APPDIR/opt/bishare/"
          cp linux/packaging/bishare.desktop "$APPDIR/bishare.desktop"
          cp assets/icon/bishare_icon.png "$APPDIR/bishare.png"
          cp assets/icon/bishare_icon.png "$APPDIR/.DirIcon"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/opt/bishare/bishare" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "BIShare-$VER-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            BIShare-*-linux-x64.tar.gz
            BIShare-*-linux-x64.deb
            BIShare-*-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [android, windows, linux, macos]
    runs-on: ubuntu-latest
    # A tag creates/refreshes its Release; a manual dispatch with `version`
    # attaches the artifacts to that existing release (e.g. v2.4.5). Dispatch
    # without a version just leaves downloadable artifacts. `!cancelled()`
    # keeps this running when one platform fails — the successful artifacts
    # still ship, the failed one just isn't in the list.
    if: ${{ !cancelled() && (github.ref_type == 'tag' || inputs.version != '') }}
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = "tag" ] || TAG="v${VERSION_INPUT}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber BIShare-* || \
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BIShare $TAG" \
            --generate-notes \
            BIShare-*

  # After a tag's assets are on the Release, rewrite every package-manager
  # manifest (winget, Scoop, Chocolatey, Homebrew cask) to that version and
  # commit them to main, so `packaging/` is always the current release. With a
  # TAP_TOKEN secret it also pushes the cask to BIShare-project/homebrew-tap;
  # without one it just says so. Submitting to winget-pkgs / chocolatey.org
  # stays manual — see packaging/README.md.
  packaging:
    needs: [release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Update manifests to ${{ github.ref_name }}
        run: packaging/bump.sh "${GITHUB_REF_NAME#v}"
      - name: Commit manifests to main
        run: |
          git config user.name "bishare-release"
          git config user.email "support@billiongroup.net"
          git add packaging
          git diff --cached --quiet && { echo "manifests already current"; exit 0; }
          git commit -m "packaging: manifests for ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:main
      - name: Push the cask to the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::TAP_TOKEN not set — run 'packaging/bump.sh ${GITHUB_REF_NAME#v} --tap' locally to update the Homebrew tap"; exit 0
          fi
          gh auth setup-git
          git config --global user.name "bishare-release"
          git config --global user.email "support@billiongroup.net"
          packaging/bump.sh "${GITHUB_REF_NAME#v}" --tap
