name: release

# Builds the installable artifacts for a version tag and attaches them to a
# GitHub Release: Android APK (release-signed), macOS DMG (ad-hoc signed —
# Gatekeeper right-click-open until notarization lands), Windows x64 ZIP
# (unsigned), Linux x64 tar.gz + .deb + AppImage. The Snap has its own
# workflow (snap.yml) on the same tag. winget/Scoop manifests that point at
# the Windows ZIP live in packaging/.
#
# Usage: push a tag like v2.4.5 (or run manually via workflow_dispatch, which
# names artifacts after the short SHA instead).
#
# Shared gotchas (mirrors ci.yml / windows.yml — keep in sync):
#  - frb_generated.* are gitignored → regenerate with the pinned codegen 2.12.0
#  - protocol crate is vendored (rust/bishare-protocol) — single checkout
#  - windows-2022 pin: windows-latest's preview MSVC hard-errors gal /
#    permission_handler_windows (/await + <experimental/coroutine>)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version to build + attach to (e.g. 2.4.5, no leading v). Empty = artifacts only, no release."
        required: false
        default: ""

permissions:
  contents: write

env:
  FRB_VERSION: "2.12.0"
  VERSION_INPUT: ${{ inputs.version }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Restore release signing (from encrypted repo secrets)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/bishare-release.jks
          cat > android/key.properties <<'EOF'
          ${{ secrets.ANDROID_KEY_PROPERTIES }}
          EOF
      - run: flutter pub get
      - name: flutter_rust_bridge codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version $FRB_VERSION
          flutter_rust_bridge_codegen generate
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build APK (release, universal)
        run: flutter build apk --release
      - name: Name artifact
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="${VERSION_INPUT:-${GITHUB_SHA::7}}"
          cp build/app/outputs/flutter-apk/app-release.apk "BIShare-$VER-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: BIShare-*-android.apk
          if-no-files-found: error

  # macOS DMG is SKIPPED for now (owner's call, 2026-08-12): the Mac app ships
  # via the App Store/TestFlight, and an ad-hoc DMG kept tripping over
  # restricted entitlements (Sign in with Apple needs a provisioning profile).
  # To revive: add Developer ID cert + notarytool secrets, drop the ad-hoc
  # steps below, and put `macos` back in the release job's `needs`.
  macos:
    if: false
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # The project pins the App Store team; the runner has no cert or
      # provisioning, so switch every target to ad-hoc local signing. Style
      # must become Manual — Automatic hard-errors without a team ("Signing
      # for Runner requires a development team").
      - name: Ad-hoc code signing (no Apple certs on CI)
        run: |
          sed -i '' \
            -e 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/CODE_SIGN_IDENTITY = "-";/g' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            macos/Runner.xcodeproj/project.pbxproj
      # Sign in with Apple is a restricted entitlement — it demands a
      # provisioning profile, which ad-hoc signing can't carry. Strip it from
      # the DMG build only (login is behind a remote flag anyway; the App
      # Store build keeps it).
      - name: Strip provisioning-profile entitlements (ad-hoc build)
        run: |
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.applesignin" "$f" || true
          done
      - run: flutter pub get
      - name: flutter_rust_bridge codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version $FRB_VERSION
          flutter_rust_bridge_codegen generate
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build macOS (release)
        run: flutter build macos --release
      - name: Package DMG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="${VERSION_INPUT:-${GITHUB_SHA::7}}"
          APP=$(/bin/ls -d build/macos/Build/Products/Release/*.app | head -1)
          mkdir dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "BIShare" -srcfolder dmg-staging -ov -format UDZO \
            "BIShare-$VER-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: BIShare-*-macos.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: flutter_rust_bridge codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version $env:FRB_VERSION
          flutter_rust_bridge_codegen generate
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Windows (release)
        run: flutter build windows --release
      - name: Package ZIP
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") }
                 elseif ($env:VERSION_INPUT) { $env:VERSION_INPUT }
                 else { $env:GITHUB_SHA.Substring(0,7) }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "BIShare-$ver-windows-x64.zip"

      # MSIX for the Microsoft Store. Built from the SAME Release output the ZIP
      # wraps, so the two artifacts are always the same binaries.
      #
      # Self-signed here on purpose: Partner Center re-signs Store submissions,
      # so a paid certificate buys nothing for that route. The package is
      # therefore sideloadable for testing but NOT trusted by SmartScreen —
      # ship the ZIP for direct downloads and reserve the MSIX for the Store.
      - name: Package MSIX (Microsoft Store)
        shell: pwsh
        continue-on-error: true
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") }
                 elseif ($env:VERSION_INPUT) { $env:VERSION_INPUT }
                 else { "0.0.0" }
          # The Store demands a four-part version whose last part is 0.
          dart run msix:create --version "$ver.0" --output-name "BIShare-$ver-windows-x64"
          Get-ChildItem -Recurse -Filter *.msix | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            BIShare-*-windows-x64.zip
            build/windows/**/*.msix
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libayatana-appindicator3-dev \
            libkeybinder-3.0-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: flutter_rust_bridge codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version $FRB_VERSION
          flutter_rust_bridge_codegen generate
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Linux (release)
        run: flutter build linux --release
      - name: Package tar.gz
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="${VERSION_INPUT:-${GITHUB_SHA::7}}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          tar -C build/linux/x64/release/bundle -czf "BIShare-$VER-linux-x64.tar.gz" .
      # .deb: bundle to /opt/bishare, launcher symlink in /usr/bin, desktop
      # entry + hicolor icon. Depends mirrors the runtime side of the apt
      # build deps above.
      - name: Package .deb
        run: |
          STAGE=deb-staging
          mkdir -p "$STAGE/DEBIAN" "$STAGE/opt/bishare" "$STAGE/usr/bin" \
                   "$STAGE/usr/share/applications" \
                   "$STAGE/usr/share/icons/hicolor/512x512/apps"
          cp -r build/linux/x64/release/bundle/. "$STAGE/opt/bishare/"
          ln -s /opt/bishare/bishare "$STAGE/usr/bin/bishare"
          cp linux/packaging/bishare.desktop "$STAGE/usr/share/applications/"
          cp assets/icon/bishare_icon.png "$STAGE/usr/share/icons/hicolor/512x512/apps/bishare.png"
          SIZE=$(du -sk "$STAGE" | cut -f1)
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: bishare
          Version: $VER
          Architecture: amd64
          Maintainer: BIShare project <support@billiongroup.net>
          Section: net
          Priority: optional
          Installed-Size: $SIZE
          Homepage: https://bishare.app
          Depends: libgtk-3-0, libayatana-appindicator3-1, libkeybinder-3.0-0, liblzma5
          Description: Fast, private, cross-platform file sharing
           Direct device-to-device transfers over the local network, end-to-end
           encrypted. Works with iPhone, Android, macOS, Windows, Linux and any
           browser. No account, no ads, no cloud in the middle.
          EOF
          dpkg-deb --build --root-owner-group "$STAGE" "BIShare-$VER-linux-x64.deb"
      # AppImage: self-contained AppDir wrapping the same bundle. FUSE is
      # unavailable on hosted runners, hence --appimage-extract-and-run.
      - name: Package AppImage
        run: |
          APPDIR=BIShare.AppDir
          mkdir -p "$APPDIR/opt/bishare"
          cp -r build/linux/x64/release/bundle/. "$APPDIR/opt/bishare/"
          cp linux/packaging/bishare.desktop "$APPDIR/bishare.desktop"
          cp assets/icon/bishare_icon.png "$APPDIR/bishare.png"
          cp assets/icon/bishare_icon.png "$APPDIR/.DirIcon"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/opt/bishare/bishare" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "BIShare-$VER-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            BIShare-*-linux-x64.tar.gz
            BIShare-*-linux-x64.deb
            BIShare-*-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    # A tag creates/refreshes its Release; a manual dispatch with `version`
    # attaches the artifacts to that existing release (e.g. v2.4.5). Dispatch
    # without a version just leaves downloadable artifacts. `!cancelled()`
    # keeps this running when one platform fails — the successful artifacts
    # still ship, the failed one just isn't in the list.
    if: ${{ !cancelled() && (github.ref_type == 'tag' || inputs.version != '') }}
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = "tag" ] || TAG="v${VERSION_INPUT}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber BIShare-* || \
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BIShare $TAG" \
            --generate-notes \
            BIShare-*
