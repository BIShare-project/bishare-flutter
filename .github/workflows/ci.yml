name: flutter-ci

on: [push, pull_request]

jobs:
  # The cross-platform parity gate: the shared bishare-protocol crypto/binary/wire
  # vectors must be green before any Dart runs. Mark this a required status check.
  rust-vectors:
    runs-on: ubuntu-latest
    steps:
      # The FFI crate path-depends on ../../bishare-protocol/rust, so both repos
      # must sit as sibling dirs (matches the manifest paths + working-directory
      # this file already assumes). bishare-protocol is public.
      - name: Checkout bishare-flutter
        uses: actions/checkout@v4
        with: { path: bishare-flutter }
      - name: Checkout bishare-protocol
        uses: actions/checkout@v4
        with: { repository: BIShare-project/bishare-protocol, path: bishare-protocol }
      - uses: dtolnay/rust-toolchain@stable
      - name: 183 cross-platform crypto/binary/model/util vectors
        run: cargo test --release --manifest-path bishare-protocol/rust/Cargo.toml
      # NOTE: FFI-crate build + golden generator + FFI unit tests moved to the
      # `flutter` job — they need `frb_generated.rs`, whose codegen requires the
      # Flutter toolchain (`flutter_rust_bridge_codegen` shells out to `flutter`),
      # which isn't installed on this ubuntu vectors job. The HW-AES guards below
      # are grep-only and stay here.
      # Phase 0 HW-AES guard. cargokit sets CARGO_ENCODED_RUSTFLAGS, which cargo
      # does NOT merge with .cargo/config.toml rustflags — so the aes_armv8/
      # polyval_armv8 cfgs are injected by a vendored patch in cargokit's
      # android_environment.dart. A cargokit bump would silently overwrite that
      # file and drop the patch, regressing Android AES-256-GCM ~11x (software
      # AES) with no build error. Fail loudly if the injection disappears.
      # NOTE: this guards that the cfg is INJECTED; asserting HW-AES is actually
      # ACTIVE (via a build_flags field in the benchmark JSON) is a Phase 3 gate.
      - name: HW-AES cfg guard (cargokit must still inject aes_armv8 on Android)
        run: |
          f=bishare-flutter/rust_builder/cargokit/build_tool/lib/src/android_environment.dart
          if grep -q 'CARGO_ENCODED_RUSTFLAGS' "$f" \
             && grep -q 'aes_armv8' "$f" \
             && grep -q 'polyval_armv8' "$f"; then
            echo "OK: cargokit injects aes_armv8/polyval_armv8 into CARGO_ENCODED_RUSTFLAGS"
          else
            echo "::error file=$f::HW-AES cfg injection missing — a cargokit bump likely dropped the [BIShare speed fix]. Android AES-256-GCM would run ~11x slower (software). Re-apply the aes_armv8/polyval_armv8 append to CARGO_ENCODED_RUSTFLAGS."
            exit 1
          fi
      # The SAME HW-AES trap on APPLE (iOS/macOS), via a DIFFERENT mechanism: cargo
      # discovers .cargo/config.toml by walking UP from the process CWD, not from
      # --manifest-path. cargokit runs cargo from a temp dir inside Xcode DerivedData
      # (outside the project), so the [target.cfg(aarch64)] rustflags in
      # rust/.cargo/config.toml were never found → iOS/macOS shipped SOFTWARE AES
      # (~11x slower) with NO build error (2026-07-13 regression, App Store archive
      # confirmed affected). Fix: run cargo from the crate's manifest dir. A cargokit
      # bump that overwrites builder.dart would drop it and silently regress Apple.
      - name: HW-AES cfg guard (cargokit must run cargo from the manifest dir on Apple)
        run: |
          f=bishare-flutter/rust_builder/cargokit/build_tool/lib/src/builder.dart
          if grep -q 'workingDirectory: environment.manifestDir' "$f"; then
            echo "OK: cargokit runs cargo from the manifest dir → rust/.cargo/config.toml aes_armv8 is found on iOS/macOS"
          else
            echo "::error file=$f::Apple HW-AES fix missing — cargo must run with workingDirectory=environment.manifestDir so it discovers rust/.cargo/config.toml (aes_armv8/polyval_armv8). Without it iOS/macOS AES-256-GCM runs ~11x slower (software) with no build error. Re-apply the workingDirectory arg in Builder.build()."
            exit 1
          fi

  flutter:
    needs: rust-vectors # Dart is skipped if the vectors are red
    runs-on: macos-14
    defaults:
      run:
        working-directory: bishare-flutter
    steps:
      - name: Checkout bishare-flutter
        uses: actions/checkout@v4
        with: { path: bishare-flutter }
      - name: Checkout bishare-protocol
        uses: actions/checkout@v4
        with: { repository: BIShare-project/bishare-protocol, path: bishare-protocol }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # frb_generated.rs + lib/src/rust/frb_generated*.dart are gitignored →
      # regenerate before analyze/test (matches runtime FRB version).
      - name: flutter_rust_bridge codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.12.0
          flutter_rust_bridge_codegen generate
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # FFI crate build + golden generator + FFI unit tests (moved here from the
      # ubuntu job — they need the frb codegen above). Paths are relative to the
      # bishare-flutter working dir; the crate resolves ../../bishare-protocol/rust.
      - name: FFI crate builds + golden generator runs
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          cargo run --example golden --manifest-path rust/Cargo.toml
      - name: FFI crate unit tests (QUIC loopback + stalled-sender timeout)
        run: cargo test --manifest-path rust/Cargo.toml
      - run: flutter analyze
      - run: flutter test
      # NOTE: an `integration_test/rust_vectors_test.dart -d macos` step used to
      # live here, but that file was never committed (the dir doesn't exist), so
      # the step could never pass. FFI↔Dart golden parity is covered by the
      # "FFI crate builds + golden generator runs" step above plus `flutter test`.
      # Re-add a macOS integration step here if/when that test file is committed.
      # Throughput gate (≥40 MB/s encrypted) stays a manual RELEASE measurement:
      #   BISHARE_BENCH=1 flutter run --release -d macos → "BISHARE_BENCH RESULT: N MB/s".
