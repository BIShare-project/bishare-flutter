# fdroiddata metadata for BIShare — DRAFT, ready to submit once v2.4.6 is
# tagged (the first tag that contains the FOSS build variant). Submit by
# copying this file to fdroiddata's metadata/com.bishare.app.yml in a GitLab
# merge request. Modeled on org.localsend.localsend_app.yml (Flutter + Rust).
Categories:
  - Connectivity
License: MIT
AuthorName: BIShare project
WebSite: https://bishare.app
SourceCode: https://github.com/BIShare-project/bishare-flutter
IssueTracker: https://github.com/BIShare-project/bishare-flutter/issues
Changelog: https://github.com/BIShare-project/bishare-flutter/releases

AutoName: BIShare

RepoType: git
Repo: https://github.com/BIShare-project/bishare-flutter.git

Builds:
  - versionName: 2.4.6
    versionCode: 246
    commit: v2.4.6
    sudo:
      - apt-get update
      - apt-get install -y rustup gcc libc-dev
    init:
      - rustup default stable
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
    srclibs:
      - flutter@3.44.5
    prebuild:
      # FOSS variant: swaps mobile_scanner for the pure-Dart stub in
      # fdroid/mobile_scanner_stub (upstream bundles Google MLKit).
      - export PATH=$$flutter$$/bin:$PATH
      - flutter config --no-analytics
      - sh tool/foss_flavor.sh
      # frb_generated.* are gitignored — regenerate with the pinned codegen,
      # then the app's build_runner outputs (mirrors the repo's CI).
      - cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - flutter_rust_bridge_codegen generate
      - dart run build_runner build --delete-conflicting-outputs
    scanignore:
      - rust/target
      - rust_builder/cargokit
    build:
      - export PATH=$$flutter$$/bin:$PATH
      - flutter build apk --release --dart-define=BISHARE_FOSS=true
    output: build/app/outputs/flutter-apk/app-release.apk

AntiFeatures:
  NonFreeNet: |-
    Optional internet features (expiring share links, remote rooms, opt-in
    anonymous telemetry) use BIShare's hosted relay at bishare.app. Every
    local-network feature works without it.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
CurrentVersion: 2.4.6
CurrentVersionCode: 246
