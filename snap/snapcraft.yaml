name: bishare
title: BIShare
base: core22
adopt-info: bishare
license: MIT
icon: snap/gui/bishare.png
website: https://bishare.app
source-code: https://github.com/BIShare-project/bishare-flutter
issues: https://github.com/BIShare-project/bishare-flutter/issues
contact: support@billiongroup.net
summary: Send large files to any device — free, encrypted, no account
description: |
  Send large files to a phone, another computer, or someone else entirely.
  BIShare is free, needs no account, and encrypts everything end to end.

  Two ways to send, one app:

  **On the same Wi-Fi** devices find each other by themselves and transfer at
  local network speed, with nothing uploaded anywhere. Photos and videos
  arrive as the original file: full resolution, metadata intact, no
  recompression.

  **Anywhere else** you get a link or a six-character code. The other person
  opens it in any browser, on any device, with nothing to install and no
  account to make. Up to 100 GB per transfer. Links expire after 24 hours, or
  after a single download if you choose.

  What you can send:

  * Photos and videos, as the original file
  * Documents, PDFs, archives, any file type
  * A whole folder, sent as a single archive
  * Text and clipboard content between your own devices

  Privacy by default:

  * End-to-end encryption on every transfer (X25519 + AES-256-GCM)
  * Files are encrypted before upload; the key stays in the link and never
    reaches the relay
  * Local transfers never leave your network
  * No account, no sign-up, no tracking

  More:

  * Transfer rooms: several people share into one code, in a meeting or a class
  * An interrupted transfer resumes instead of starting over
  * QR Beam: with no network at all, one screen plays animated QR codes and
    another device's camera reads them
  * Works with Android, iPhone, iPad, Mac and Windows, in any direction
  * Free and open source under the MIT licence

grade: stable
confinement: strict
compression: lzo

# The application. The `gnome` extension wires up the GTK3 runtime, themes,
# fonts, and desktop-portal integration that a Flutter Linux app needs.
apps:
  bishare:
    command: bishare
    extensions: [gnome]
    common-id: com.bishare.app
    plugs:
      - network         # LAN transfer + cloud relay (remote share / rooms)
      - network-bind    # local HTTP receiver (shelf listens on a LAN port)
      - avahi-observe   # mDNS device discovery via the host avahi daemon (bonsoir)
      - home            # open/save files the user explicitly picks
      - removable-media # save to USB drives / mounted volumes
      - audio-playback  # notification / transfer sounds

# Clang 18 for the native plugins. flutter_zxing compiles zxing-cpp, whose C++20
# ranges core22's clang 14 cannot build ("no matching function for call to
# 'construct_at'"). Verified in an Ubuntu 22.04 container: clang 18 builds it
# against core22's own libstdc++ 11.
package-repositories:
  - type: apt
    url: http://apt.llvm.org/jammy/
    suites: [llvm-toolchain-jammy-18]
    components: [main]
    key-id: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421

parts:
  # Rust toolchain for the flutter_rust_bridge core. cargokit compiles the
  # `bishare_ffi` crate during `flutter build linux`. The bishare-protocol
  # crate is VENDORED in-repo (rust/bishare-protocol), so the build needs no
  # network access to any private sibling repository.
  rust-toolchain:
    plugin: nil
    build-packages:
      - curl
      - build-essential
      - pkg-config
    override-build: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --default-toolchain stable --profile minimal
      craftctl default

  bishare:
    after: [rust-toolchain]
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    # cargo lives under $HOME/.cargo after rustup; expose it to the Flutter
    # build so cargokit can find it.
    #
    # The flutter path has to be spelled out too. Setting PATH here REPLACES the
    # one the flutter plugin contributes, so without it the plugin's own build
    # still works (it uses its own environment) while anything in override-build
    # below dies with "flutter: command not found". The plugin clones the SDK
    # into $CRAFT_PART_BUILD/flutter-distro during pull.
    build-environment:
      - PATH: "$CRAFT_PART_BUILD/flutter-distro/bin:$HOME/.cargo/bin:$PATH"
    build-packages:
      - clang-18
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
      # Verified on a clean Ubuntu 22.04 build (Azure): these desktop plugins
      # fail `cmake` configure without their dev headers —
      # flutter_secure_storage_linux needs libsecret + jsoncpp, tray_manager
      # needs ayatana-appindicator.
      - libsecret-1-dev
      - libjsoncpp-dev
      - libayatana-appindicator3-dev
    override-pull: |
      craftctl default
      # Derive the snap version from pubspec.yaml (e.g. "2.4.5+245" -> "2.4.5").
      version="$(grep '^version:' pubspec.yaml | head -1 | sed -E 's/version:\s*//; s/\+.*//')"
      craftctl set version="$version"
    # The bridge between Dart and Rust is generated, not committed: without it
    # the Rust crate fails to compile (E0583, missing frb_generated.rs) and
    # every Dart call site reports an undefined RustLib.
    #
    # The generator needs a Flutter SDK, and the plugin's own SDK does not exist
    # yet at this point: it is cloned inside the plugin's build, which is what
    # `craftctl default` runs at the end of this script. So fetch a shallow SDK
    # of our own purely to generate, then hand over. Mirrors the codegen step in
    # .github/workflows/release.yml — keep the version in step with FRB_VERSION
    # there.
    override-build: |
      # Flutter invokes plain `clang`/`clang++`; /usr/local/bin is ahead of
      # /usr/bin on PATH, so these shims select clang 18 for the whole build.
      ln -sf /usr/bin/clang-18 /usr/local/bin/clang
      ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
      clang++ --version
      git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$CRAFT_PART_BUILD/flutter-codegen"
      export PATH="$CRAFT_PART_BUILD/flutter-codegen/bin:$PATH"
      git config --global --add safe.directory "$CRAFT_PART_BUILD/flutter-codegen"
      flutter --version
      flutter pub get
      cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      flutter_rust_bridge_codegen generate
      dart run build_runner build --delete-conflicting-outputs
      craftctl default
