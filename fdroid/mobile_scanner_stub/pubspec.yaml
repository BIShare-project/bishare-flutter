name: mobile_scanner
description: >-
  Pure-Dart stub of mobile_scanner for the FOSS (F-Droid) build. The real
  package bundles Google's proprietary MLKit on Android; this stub satisfies
  the same imports with inert implementations. The UI never constructs them —
  every camera-scan entry point is gated on supportsCameraScan, which is false
  when built with --dart-define=BISHARE_FOSS=true.
version: 7.2.0
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
